on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Cargo doc check
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # The check uses the docs.rs feature list so that it covers what docs.rs builds.
      - run: |
          set -euo pipefail
          features=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "openmls") | .metadata.docs.rs.features[]')
          RUSTDOCFLAGS="--cfg doc_cfg --cfg docsrs" cargo +nightly doc --no-deps -F "${features}"
        working-directory: openmls
