name: Nightly full-matrix tests

# Runs the openmls test suite with every provider and every supported
# ciphersuite enabled. The per-PR `tests.yml` job runs only against
# RustCrypto and the MTI ciphersuite to keep CI fast, so this job exists
# to catch regressions in the rest of the matrix.

on:
  schedule:
    # 02:00 UTC every day. Cron syntax: minute hour dom month dow.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo for the test crate exceeds the memory of the hosted
  # runners once the ciphersuite matrix is enabled, which gets the debug
  # jobs killed mid-build. Line tables are enough for panic backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        mode:
          - { name: debug, arg: "" }
          - { name: release, arg: --release }
        features:
          - { name: base, arg: "" }
          - { name: fork-resolution, arg: "-F fork-resolution" }
          - { name: extensions-draft, arg: "-F extensions-draft,extensions-draft-test-dependencies" }
          - { name: virtual-clients-draft, arg: "-F virtual-clients-draft,virtual-clients-draft-test-dependencies" }
          # The PQ ciphersuites take the list that openmls_test expands every
          # test over from 8 copies to 29, and the rustc that builds the
          # openmls unit-test binary then needs more than the 16 GB a hosted
          # runner has. It gets killed mid-build (exit code 143) in both debug
          # and release mode. Sharding the ciphersuites over three jobs brings
          # that back to roughly what the `base` job needs. Together the three
          # shards cover the same ciphersuites as one unsharded run, including
          # ciphersuites added later.
          - { name: pq-ciphersuites-1, arg: "-F draft-ietf-mls-pq-ciphersuites", shard: "1/3" }
          - { name: pq-ciphersuites-2, arg: "-F draft-ietf-mls-pq-ciphersuites", shard: "2/3" }
          - { name: pq-ciphersuites-3, arg: "-F draft-ietf-mls-pq-ciphersuites", shard: "3/3" }
    runs-on: ubuntu-latest
    name: full matrix (${{ matrix.mode.name }}/${{ matrix.features.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests with all providers and ciphersuites
        env:
          OPENMLS_TEST_CIPHERSUITE_SHARD: ${{ matrix.features.shard }}
        run: |
          cargo test ${{ matrix.mode.arg }} -p openmls --verbose --no-default-features \
            -F all-ciphersuites,sqlite-provider,libcrux-provider ${{ matrix.features.arg }}
