name: Nightly full-matrix tests

# Runs the openmls test suite with every provider and every supported
# ciphersuite enabled. The per-PR `tests.yml` job runs only against
# RustCrypto and the MTI ciphersuite to keep CI fast, so this job exists
# to catch regressions in the rest of the matrix.

on:
  schedule:
    # 02:00 UTC every day. Cron syntax: minute hour dom month dow.
    - cron: "0 2 * * *"
  workflow_dispatch:
  # TEMPORARY: run the full matrix on pull requests while we diagnose why the
  # `pq-ciphersuites` jobs get their runner torn down (exit 143). Revert before
  # merging — this is ten cold full-matrix builds per push.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo for the test crate exceeds the memory of the hosted
  # runners once the ciphersuite matrix is enabled, which gets the debug
  # jobs killed mid-build. Line tables are enough for panic backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        mode:
          - { name: debug, arg: "" }
          - { name: release, arg: --release }
        features:
          - { name: base, arg: "" }
          - { name: fork-resolution, arg: "-F fork-resolution" }
          - { name: extensions-draft, arg: "-F extensions-draft,extensions-draft-test-dependencies" }
          - { name: virtual-clients-draft, arg: "-F virtual-clients-draft,virtual-clients-draft-test-dependencies" }
          - { name: pq-ciphersuites, arg: "-F draft-ietf-mls-pq-ciphersuites" }
    runs-on: ubuntu-latest
    name: full matrix (${{ matrix.mode.name }}/${{ matrix.features.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests with all providers and ciphersuites
        run: |
          # TEMPORARY: sample memory and disk every 10s alongside the build.
          sample() {
            while true; do
              ts=$(date -u +%H:%M:%S)
              disk=$(df -m --output=avail / | tail -1 | tr -d ' ')
              awk -v ts="$ts" -v disk="$disk" '
                /^MemTotal:/     { total = $2 }
                /^MemAvailable:/ { avail = $2 }
                /^SwapTotal:/    { swtotal = $2 }
                /^SwapFree:/     { swfree = $2 }
                END {
                  printf "[res] %s  mem_avail=%dM/%dM  swap_used=%dM  disk_avail=%sM\n",
                         ts, avail/1024, total/1024, (swtotal-swfree)/1024, disk
                }
              ' /proc/meminfo
              ps -eo rss=,comm= --sort=-rss | head -3 |
                awk '{ printf "[res]              %-20s %6dM\n", $2, $1/1024 }'
              sleep 10
            done
          }
          sample &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT

          echo "[res] nproc=$(nproc)"
          free -m
          df -h /

          cargo test ${{ matrix.mode.arg }} -p openmls --verbose --no-default-features \
            -F all-ciphersuites,sqlite-provider,libcrux-provider ${{ matrix.features.arg }}
