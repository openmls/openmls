[package]
name = "openmls_libcrux_crypto"
version = "0.4.0-rc.1"
edition = "2021"
rust-version.workspace = true
authors = ["OpenMLS Authors"]
description = "A crypto backend for OpenMLS based on libcrux implementing openmls_traits."
license = "MIT"
documentation = "https://docs.rs/openmls_libcrux_crypto"
repository = "https://github.com/openmls/openmls/tree/main/openmls_libcrux_crypto"
readme = "Readme.md"

[dependencies]
# All libcrux-* and hpke-rs-* crates below are pinned to the same
# `franziskus/fallible-rng` branch/commit of the `celabshq/libcrux` monorepo.
# They must stay on the same git source: Cargo treats a crate fetched from two
# different revs as two distinct types, so e.g. `libcrux-traits` pulled from
# one rev and `libcrux-p256` (which depends on `libcrux-traits`) from another
# would fail to resolve their shared trait impls.
libcrux-aead = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng" }
libcrux-ed25519 = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng", features = [
    "rand",
] }
libcrux-hkdf = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng" }
libcrux-sha2 = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng" }
libcrux-hmac = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng" }
libcrux-hmac-drbg = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng", features = [
    "rand",
] }
libcrux-traits = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng" }

openmls_traits = { workspace = true }
openmls_memory_storage = { workspace = true }

rand = "0.10"
tls_codec.workspace = true

hpke-rs = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng", package = "hpke-rs", features = [
    "hazmat",
    "serialization",
] }
hpke-rs-crypto = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng", package = "hpke-rs-crypto" }
hpke-rs-libcrux = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng", package = "hpke-rs-libcrux" }

# ECDSA P-256 signing (there is no libcrux P-384 signing crate yet, so
# ciphersuites requiring P-384 signatures are not implemented; see Readme.md).
#
# This branch adds fallible-`CryptoRng`-friendly key generation and signing
# APIs, plus native DER encode/decode for P-256 signatures, which lets this
# crate avoid a hand-rolled DER codec and RNG-panic workaround.
libcrux-p256 = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng" }
libcrux-ecdsa = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng", features = [
    "rand",
] }

# ML-DSA-44/65/87 signing.
libcrux-ml-dsa = { git = "https://github.com/celabshq/libcrux", branch = "franziskus/fallible-rng" }

# FF1-AES128 backing for the virtual-clients-draft reuse-guard PRP.
# libcrux has no FF1 implementation, so this provider also uses the
# RustCrypto-based `fpe` crate.
fpe = { version = "0.6", optional = true }
aes = { version = "0.8", optional = true }

[features]
extensions-draft = [
    "openmls_traits/extensions-draft",
    "openmls_memory_storage/extensions-draft",
]
draft-ietf-mls-pq-ciphersuites = [
    "openmls_traits/draft-ietf-mls-pq-ciphersuites",
    "openmls_memory_storage/draft-ietf-mls-pq-ciphersuites",
    "hpke-rs/draft-ietf-hpke-pq",
]
virtual-clients-draft = [
    "extensions-draft",
    "openmls_traits/virtual-clients-draft",
    "openmls_memory_storage/virtual-clients-draft",
    "dep:fpe",
    "dep:aes",
]
targeted-messages-draft = ["openmls_traits/targeted-messages-draft"]
