[package]
name = "openmls_async_tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "End-to-end tests for the async mode of OpenMLS."

# The crate has its own workspace. In the main workspace, feature unification
# with the sync-only crates would switch `openmls_traits` to sync mode.
[workspace]

[dependencies]

[dev-dependencies]
openmls = { path = "../openmls", features = ["async", "test-utils"] }
openmls_basic_credential = { path = "../basic_credential" }
openmls_rust_crypto = { path = "../openmls_rust_crypto" }
openmls_sqlx_storage = { path = "../sqlx_storage" }
serde = "1.0"
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
